# === General Settings ===
set -g status-position top

set -g detach-on-destroy off
set -g history-limit 1000000
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
# Allow applications inside tmux to bypass tmux and talk directly to the terminal
# Allow applications inside tmux to bypass tmux and talk directly to the terminal
set -as terminal-features ',xterm-256color:clipboard:RGB:usstyle:hyperlinks'
set -as terminal-overrides ',xterm-256color:Ms=\\E]52;c;%p2%s\\7'

# Allow clipboard and escape sequences to pass cleanly through the SSH connection
set -g allow-passthrough on
# Allow applications inside tmux (like Vim) to read and write to the system clipboard
set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# === vi like copy mode in tmux ===
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# === Keybindings ===
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config"
bind-key \\ display-popup -E

# === Catppuccin ===
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# === Statusline ===
# 1. Configure the pane format text (Shows Pane Index and Current Command, e.g., "1: nvim")
set -g @catppuccin_pane_text " #P: #{pane_current_command}"

# === Statusline Configuration ===
# 2. Add @catppuccin_status_pane to your status-left layout
set -g status-left "#{prefix_highlight} #{E:@catppuccin_status_session} #{E:@catppuccin_status_pane} "
set -g status-left-length 50

set -g status-right "#[fg=#a6e3a1]🖥  #{cpu_percentage} #[fg=#89b4fa]💾 #{ram_percentage} #{E:@catppuccin_status_date_time} CS: #{continuum_status}"
set -g status-right-length 100
set -g @catppuccin_date_time_text " %a %b %d %H:%M"

# === TPM ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank' 

# === Catppuccin Theme Settings ===
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# === Resurrect & Continuum Automation Settings ===
# These must be set before TPM initializes the plugins
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (Keep at the absolute bottom)
run '~/.tmux/plugins/tpm/tpm'

