# === General ===
set -g status-position top
set -g detach-on-destroy off
set -g history-limit 1000000
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
# Allow applications inside tmux to bypass tmux and talk directly to the terminal
set -as terminal-features ',xterm-256color:clipboard:RGB:usstyle:hyperlinks'
set -as terminal-overrides ',xterm-256color:Ms=\\E]52;c;%p2%s\\7'
# Allow clipboard and escape sequences to pass cleanly through SSH
set -g allow-passthrough on
# Allow applications inside tmux (like Vim) to read/write system clipboard
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# === Vi copy mode ===
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# === Keybindings ===
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded"
bind-key \\ display-popup -E

# === Catppuccin ===
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_pane_text " #P: #{pane_current_command}"
set -g @catppuccin_date_time_text " %a %b %d %H:%M"

# === Status line ===
set -g status-left "#{prefix_highlight} #{E:@catppuccin_status_session} #{E:@catppuccin_status_pane} "
set -g status-left-length 50
set -g status-right "#[fg=#a6e3a1]🖥  #{cpu_percentage} #[fg=#89b4fa]💾 #{ram_percentage} #{E:@catppuccin_status_date_time} CS: #{continuum_status}"
set -g status-right-length 100

# === Resurrect & Continuum ===
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

# === Plugins ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
