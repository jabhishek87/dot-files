# === Keybindings ===
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind-key \\ display-popup -E

# === General Tweaks ===
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g status-position top
set -g detach-on-destroy off
set -g history-limit 1000000
set -g mouse on
set -g focus-events on
set -s escape-time 0           # Fixes Vim/Neovim escape key delay glitches

# Clipboard & Index Layout
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Visual Borders
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# === Catppuccin v2 Setup ===
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load Catppuccin manually via exact physical path (Bypasses TPM bugs)
run '/home/ajaiswal/.tmux/plugins/catppuccin/catppuccin.tmux'

# Theme Modules Configuration
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-left "#{prefix_highlight} #{E:@catppuccin_status_session} #{E:@catppuccin_status_pane} "
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"

# === Resurrect & Continuum ===
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '15'

# === Plugins Manager ===
set -g @plugin 'tmux-plugins/tpm'
# REMOVED duplicate catppuccin from here to prevent duplicate loading errors
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Initialize TPM (Keep as the absolute final line)
run '~/.tmux/plugins/tpm/tpm'
